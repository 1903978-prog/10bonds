name: Portfolio Efficiency
# The portfolio engine (Methodology 4, the portfolio spec, lib/netSpread): runs on a runner, never in the website process. Nightly after the Efficient Database (23:00 UTC)
# and Bond Efficiency (23:30 UTC) jobs, i.e. 06:00 Asia/Bangkok plus a margin, and again at 02:10 UTC, which finishes a stopped run (stored lists already saved are skipped) and picks up an admin "Recalculate" request; no daytime rebuilds.
# It needs the Bond Efficiency run of the same price batch (it runs that first if missing). A price batch that is already optimised is skipped.
on:
  workflow_dispatch:
    inputs:
      force: { description: "Recalculate even if this price batch is done", type: boolean, default: false }
  schedule:
    - cron: "10 0 * * *"
    - cron: "10 2 * * *"
concurrency:
  group: portfolio-build
  cancel-in-progress: false
jobs:
  portfolio-efficiency:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
      PE_TRIGGER: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - name: Portfolio Efficiency run
        run: npx vite-node -c vitest.config.ts scripts/portfolio-efficiency.ts ${{ inputs.force && '--force' || '' }} | tee pe.txt
      - name: Every other stored list (EUR/USD x All/1k-10k x years 1-15), one horizon at a time
        if: always()
        run: npx vite-node -c vitest.config.ts scripts/portfolio-build.ts | tee build.txt
      - name: Slider snapshot (90 positions)
        if: always()
        run: npx vite-node -c vitest.config.ts scripts/build-slider-snapshot.ts | tee snapshot.txt
      - name: Summary
        if: always()
        run: cat pe.txt snapshot.txt build.txt >> "$GITHUB_STEP_SUMMARY" || true
