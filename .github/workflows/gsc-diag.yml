name: GSC diag (temporary)
on:
  push:
    branches: [claude/project-thread-qnr7g5]
    paths: [scripts/gsc-diag.mjs, .github/workflows/gsc-diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save postgres@3.4.9
      - run: node scripts/gsc-diag.mjs
        env:
          G: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
