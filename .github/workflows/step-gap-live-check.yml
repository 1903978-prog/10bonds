name: Step gap live check
# Manual (and when the rule or this check changes): the slider frontier on live EUR data without and with the minimum
# extra return per risk step (lib/stepGap.ts). Read-only; fails if a frontier is not monotonic.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: npx vite-node -c vitest.config.ts scripts/step-gap-live-check.ts
