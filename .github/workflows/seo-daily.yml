name: SEO daily snapshot
# Every day: asks the site to save today's Google and Bing numbers and keyword rankings, so /admin/seo can chart progress.
# Uses the ACCOUNTS_DATABASE_URL secret only to sign the request (never sent).
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - name: Ask the site to save today's numbers
        run: |
          if [ -z "$ACCOUNTS_DATABASE_URL" ]; then echo "No ACCOUNTS_DATABASE_URL: nothing to do."; exit 0; fi
          token=$(printf 'seo-daily' | openssl dgst -sha256 -hmac "$ACCOUNTS_DATABASE_URL" -hex | awk '{print $NF}')
          curl -fsS --retry 3 --max-time 60 -X POST -H "Authorization: Bearer $token" https://10bonds.com/api/seo/daily
