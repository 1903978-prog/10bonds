name: Live test tmp
on:
  push:
    branches: [claude/live-test-tmp]
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      MINUTES: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: memory sampler
        run: |
          ( for i in $(seq 1 30); do echo "--- $(date -u +%T)"; timeout 25 flyctl ssh console -a 10bonds -C "sh -c 'free -m | sed -n 2p; ps -o rss=,args= -C node | cut -c1-70'" 2>&1 | tail -4; sleep 20; done ) > mem.log 2>&1 &
      - run: node live-test.mjs
      - run: sleep 5; flyctl status -a 10bonds || true; flyctl logs -a 10bonds --no-tail 2>&1 | tail -40 || true; echo ===MEM; cat mem.log
