name: Secval probe
# Temporary, read-only: prints the live site's headers. Removed before merge.
on:
  push:
    branches: [claude/project-thread-xze0y9]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Headers
        run: |
          curl -s -D - -o /dev/null -H 'Accept-Encoding: gzip, br' https://10bonds.com/ | grep -iE '^(HTTP|server|via|cache|content-encoding|content-length|fly-)' || true
          echo ---- bond sitemap; curl -s -D - -o /dev/null -H 'Accept-Encoding: gzip' https://10bonds.com/bonds/sitemap.xml | grep -iE '^(HTTP|cache|content-encoding|content-length)'
          echo ---- 404 page; curl -s -o /dev/null -w '%{http_code}\n' https://10bonds.com/risk-assessment
      - name: Crawl check (parallel)
        run: |
          curl -s https://10bonds.com/sitemap.xml | grep -oE '<loc>[^<]+' | sed 's/<loc>//' > urls.txt
          wc -l urls.txt
          cat urls.txt | xargs -P 8 -I{} curl -s -m 20 -o /dev/null -w '%{http_code} %{time_total} {}\n' {} | awk '$1!=200' | head -30
          echo done-crawl
