name: Ranking live check
# Manual (and when this file or the script changes): the deploy ranking self-check on fresh caps vs the stored table. Counts only, read-only.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/ranking-live-check.yml", "scripts/ranking-live-check.ts"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: npx vite-node -c vitest.config.ts scripts/ranking-live-check.ts
