name: Efficient Database
# Rebuilds the 90-position Efficient Database every day at 06:00 Asia/Bangkok (23:00 UTC), on a runner, never in the website process:
# bond codes for new bonds, the 30 positions of each term from the portfolio spec (docs/PORTFOLIO_SPEC.md) for the current price batch, then the
# checked 90-position snapshot. A batch that is already built is skipped. The "Precompute portfolio lists" job also builds it after every price copy it sees (every 3 hours).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"
concurrency:
  group: portfolio-build
  cancel-in-progress: false
jobs:
  efficient-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - name: Portfolio engine (90 positions)
        run: npx vite-node -c vitest.config.ts scripts/portfolio-efficiency.ts | tee bands.txt
      - name: Term lists for EUR 1k-10k and USD (2, 4 and 10 years)
        run: PB_TERMS_ONLY=1 npx vite-node -c vitest.config.ts scripts/portfolio-build.ts | tee build.txt
      - name: Efficient Database (90 positions)
        run: npx vite-node -c vitest.config.ts scripts/build-slider-snapshot.ts | tee snapshot.txt
      - name: Summary
        if: always()
        run: cat build.txt snapshot.txt >> "$GITHUB_STEP_SUMMARY" || true
