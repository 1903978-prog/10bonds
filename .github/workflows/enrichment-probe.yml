name: Enrichment probe
# Read-only counts of the sector, seniority, call and parent fields the copy already carries. Counts only.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/enrichment-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          q() { psql "$DATABASE_URL" -X -A -t -F ' | ' -c "$1"; }
          echo "== columns"; q "select string_agg(column_name, ',' order by ordinal_position) from information_schema.columns where table_name='public_bonds'"
          echo "== industry by currency (filled / total)"; q "select currency, count(*), count(industry) from public_bonds group by 1 order by 2 desc limit 6"
          echo "== industry values USD"; q "select industry, count(*) from public_bonds where currency='USD' group by 1 order by 2 desc limit 60"
          echo "== industry values EUR"; q "select industry, count(*) from public_bonds where currency='EUR' group by 1 order by 2 desc limit 60"
          echo "== seniority values"; q "select currency, seniority, count(*) from public_bonds where currency in ('EUR','USD') group by 1,2 order by 3 desc limit 30"
          echo "== call_date filled"; q "select currency, count(*), count(call_date) from public_bonds where currency in ('EUR','USD') group by 1"
          echo "== is_* flags"; q "select count(*) filter (where is_at1), count(*) filter (where is_tier2), count(*) filter (where is_snp), count(*) filter (where is_cln), count(instrument_note) from public_bonds"
          echo "== USD issuers with no industry (top 40 by bonds)"; q "select issuer, count(*) from public_bonds where currency='USD' and industry is null group by 1 order by 2 desc limit 40"
          echo "== distinct issuers USD / without industry"; q "select count(distinct issuer), count(distinct issuer) filter (where industry is null) from public_bonds where currency='USD'"
          echo "== instrument_note samples"; q "select instrument_note from public_bonds where instrument_note is not null limit 8"
