name: SEO score changes (read-only)
# Manual: prints which criteria changed between the last two SEO assessments of each market, and the current
# evidence for the guides dimension. Reads only.
on: workflow_dispatch
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts >/dev/null
      - run: node --experimental-strip-types --no-warnings scripts/seo-diff.mjs
