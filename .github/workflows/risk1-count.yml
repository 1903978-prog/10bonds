name: Risk 1 count
# Manual only: how many risk 1 (AAA) bonds and issuer groups each horizon has. Read-only.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-rucmt4]
    paths: [scripts/risk1-count.ts]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: npx vite-node -c vitest.config.ts scripts/risk1-count.ts
