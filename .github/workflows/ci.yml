name: Checks
# Runs on every pull request and before every deploy (deploy.yml calls it). Nothing reaches the live site unless
# all of these pass: types, lint, unit tests, the tracked database design on a real Postgres, and a browser check
# of the public pages on desktop and phone (sample data, no secrets needed).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_ACCOUNTS_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests and database design (docs/database-schema.txt)
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser check of the public pages (desktop and phone)
        run: |
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && PORT=3311 HOSTNAME=127.0.0.1 ALLOW_SAMPLE_DATA=1 SKIP_WARMUP=1 NODE_ENV=production node server.js > ../../server.log 2>&1 &)
          up=0
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3311/api/health && up=1 && break; sleep 1; done
          [ "$up" = 1 ] || { echo "The site did not start within 60 seconds"; exit 1; }
          BASE=http://127.0.0.1:3311 CHROME_CHANNEL=chrome node scripts/page-check.mjs
      # Link gate: the new build, opened as a visitor, a free user and the read-only test admin (accounts on the CI Postgres).
      # Any 404/500 on a page that must work fails the check, so a broken link never reaches the live site.
      - name: "Link check (3 roles, new build)"
        run: |
          export LINKCHECK_PASSWORD="ci-link-check-password-0123456789"
          export ACCOUNTS_DATABASE_URL="$TEST_ACCOUNTS_DATABASE_URL"
          npx vite-node -c vitest.config.ts scripts/link-accounts.ts
          (cd .next/standalone && PORT=3312 HOSTNAME=127.0.0.1 ALLOW_SAMPLE_DATA=1 SKIP_WARMUP=1 NODE_ENV=production SESSION_SECRET=ci-session-secret-0123456789abcdef ACCOUNTS_DATABASE_URL="$TEST_ACCOUNTS_DATABASE_URL" node server.js > ../../server-links.log 2>&1 &)
          up=0
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3312/api/health && up=1 && break; sleep 1; done
          [ "$up" = 1 ] || { echo "The site did not start within 60 seconds"; exit 1; }
          IGNORE="^/bonds/sitemap\\.xml$" BASE=http://127.0.0.1:3312 MAX_PAGES=250 BOND_SAMPLE=5 CHROME_CHANNEL=chrome node scripts/link-crawl.mjs
      - name: Link check report
        if: always()
        run: cat link-check-out/link-check.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Server log (on failure)
        if: failure()
        run: tail -100 server.log || true; tail -60 server-links.log || true
