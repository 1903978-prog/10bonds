name: Unclassified issuers
# Read-only list of the issuers with no country (and what else is missing), biggest first.
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: TOP=1300 FROM=80 npx vite-node -c vitest.config.ts scripts/unclassified-issuers.ts
