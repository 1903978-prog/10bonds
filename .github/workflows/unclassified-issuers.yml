name: Unclassified issuers
# Read-only list of the issuers with no country (and what else is missing), biggest first.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/unclassified-issuers.yml", "scripts/unclassified-issuers.ts"]
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: CSV=1 TOP=0 npx vite-node -c vitest.config.ts scripts/unclassified-issuers.ts
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          mkdir -p classification && mv issuers-without-country.csv classification/
          git add classification/issuers-without-country.csv && git commit -m "Issuers without country CSV" && git push || true
