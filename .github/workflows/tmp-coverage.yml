name: tmp coverage (read-only, delete after use)
on:
  push:
    branches: [claude/tmp-coverage]
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: set -o pipefail; npx vite-node -c vitest.config.ts scripts/coverage-report.ts | tee coverage.md
      - if: always()
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true
