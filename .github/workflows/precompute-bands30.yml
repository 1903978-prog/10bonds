name: Precompute 30 risk bands lists
# Works out the lists of the "30 risk bands" slider (revised 30-band method) on a fast runner and saves them in the database.
# Lists already saved for the current data are reused, so a run with nothing new takes seconds.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * *"
  push:
    branches: [main]
    paths: ["lib/bandFrontier.ts", "lib/bands30.ts", "lib/bandEngine.ts", "scripts/precompute-bands30.ts"]
concurrency:
  group: precompute-bands30
  cancel-in-progress: false
jobs:
  precompute:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: npx vite-node -c vitest.config.ts scripts/precompute-bands30.ts
