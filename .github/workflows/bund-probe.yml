name: Bund probe (temporary)
on:
  push:
    branches: [claude/project-thread-014tk7]
    paths: [".github/workflows/bund-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://api.statistiken.bundesbank.de/rest
          for s in ZAR ZST; do
            echo "== $s csv"; curl -sS -m 40 -w '\nHTTP %{http_code}\n' "$B/data/BBSIS/D.I.$s.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A?lastNObservations=3&format=csv" | head -20
          done
          echo "== sdmx"; curl -sS -m 40 -w '\nHTTP %{http_code}\n' -H 'Accept: application/vnd.sdmx.data+csv;version=1.0.0' "$B/data/BBSIS/D.I.ZAR.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A?lastNObservations=3" | head -20
          echo "== multi"; curl -sS -m 40 -w '\nHTTP %{http_code}\n' "$B/data/BBSIS/D.I.ZAR.ZI.EUR.S1311.B.A604.R01XX+R30XX.R.A.A._Z._Z.A?lastNObservations=2&format=csv" | head -20
          echo "== wildcard"; curl -sS -m 60 -w '\nHTTP %{http_code}\n' "$B/data/BBSIS/D.I.ZAR.ZI.EUR.S1311.B.A604..R.A.A._Z._Z.A?lastNObservations=1&format=csv" | head -50
