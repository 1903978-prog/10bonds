name: Risk premium validation
# Manual (and when this file, the script or the model changes): Version 1.0 of the risk premium model on the live
# bond copy, current vs risk-adjusted top 10, bonds below the hurdle, exceptional spreads, sensitivity. Read-only.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/risk-premium-validation.yml", "scripts/risk-premium-validation.ts", "lib/riskPremium/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: npx vite-node -c vitest.config.ts scripts/risk-premium-validation.ts
