name: Landing snapshot
# Manual: stores today's real top 10 bonds (and the data date) for the landing carousel in lib/landingBonds.json and
# commits it to the branch it is run on. Read-only on the database.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/landing-snapshot.yml", "scripts/landing-snapshot.ts"]
    branches-ignore: [main]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: npx vite-node -c vitest.config.ts scripts/landing-snapshot.ts
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/landingBonds.json
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Landing: store today's top 10 bonds snapshot"
          git push
