name: BES tile live check
# Manual: opens the live finder as an anonymous visitor, runs a search and prints page status plus the efficiency score tile text. Read-only.
on:
  workflow_dispatch:
  schedule:
    - cron: "50 4 * * *"
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/bes-tile-live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bes-tile, path: bes-tile.png, if-no-files-found: ignore }
