name: Precompute portfolio lists
# On demand only (never on push, Livio 28/10/2026; the nightly build is portfolio-efficiency.yml): makes sure every stored list exists for the current prices
# and spec version, so the live site never has to solve (a missing list answers "being prepared"). Saved lists are skipped, so a run with nothing new takes seconds.
# The nightly run (06:00 Asia/Bangkok) is portfolio-efficiency.yml; both use one concurrency group, so only one build runs at a time.
on:
  workflow_dispatch:
concurrency:
  group: portfolio-build
  cancel-in-progress: false
jobs:
  precompute:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - name: Portfolio engine (90 positions, terms)
        run: npx vite-node -c vitest.config.ts scripts/portfolio-efficiency.ts | tee bands.txt
      - name: Slider snapshot (90 positions)
        if: always()
        run: npx vite-node -c vitest.config.ts scripts/build-slider-snapshot.ts | tee snapshot.txt
      - name: Every other stored list, one horizon at a time
        if: always()
        run: npx vite-node -c vitest.config.ts scripts/portfolio-build.ts | tee build.txt
      - name: Tables
        if: always()
        run: cat snapshot.txt build.txt >> "$GITHUB_STEP_SUMMARY"; grep '^|' bands.txt >> "$GITHUB_STEP_SUMMARY" || true
