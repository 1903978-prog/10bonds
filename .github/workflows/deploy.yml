# Deploys the public 10BONDS site to Fly.io on every push to main.
# Needs one repo secret: FLY_API_TOKEN (a Fly token the owner creates himself).
# The build runs on Fly's remote builder; the runner only waits.
name: Deploy to Fly
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  # Nothing reaches the live site unless all checks pass (types, lint, tests, database design, browser check).
  test:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      # Pinned: the same tool version every run, changed on purpose only.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.118
      - name: Stop if the Fly token is not set yet
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN secret is not set: nothing deployed."
            exit 0
          fi
          echo "ok=1" >> "$GITHUB_ENV"
      - name: Create the app if it does not exist
        if: env.ok == '1'
        run: flyctl status -a 10bonds >/dev/null 2>&1 || flyctl apps create 10bonds
      - name: Database login (real data) or sample data
        if: env.ok == '1'
        run: |
          if [ -n "$DATABASE_URL" ]; then
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL" | flyctl secrets import -a 10bonds --stage >/dev/null
            flyctl secrets unset ALLOW_SAMPLE_DATA -a 10bonds --stage >/dev/null 2>&1 || true
            echo "Real data: DATABASE_URL set."
          else
            flyctl secrets set ALLOW_SAMPLE_DATA=1 -a 10bonds --stage >/dev/null
            echo "No DATABASE_URL secret yet: sample data."
          fi
      - name: Accounts login and session key
        if: env.ok == '1'
        run: |
          if [ -n "$ACCOUNTS_DATABASE_URL" ]; then
            printf 'ACCOUNTS_DATABASE_URL=%s\n' "$ACCOUNTS_DATABASE_URL" | flyctl secrets import -a 10bonds --stage >/dev/null
            echo "Accounts: ACCOUNTS_DATABASE_URL set."
          else
            echo "No ACCOUNTS_DATABASE_URL secret yet: sign-up shows 'opens very soon'."
          fi
          # The key that signs sign-in cookies is made once on the server and never printed.
          if ! flyctl secrets list -a 10bonds | grep -qw SESSION_SECRET; then
            printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)" | flyctl secrets import -a 10bonds --stage >/dev/null
            echo "SESSION_SECRET created."
          fi
          # Confirmation e-mails switch on when both secrets exist; until then sign-up works without them.
          # They actually start only once Resend shows 10bonds.com as verified (the app checks; /admin lists the DNS records).
          if [ -n "$RESEND_API_KEY" ]; then
            printf 'RESEND_API_KEY=%s\nEMAIL_FROM=%s\n' "$RESEND_API_KEY" "10BONDS <no-reply@10bonds.com>" | flyctl secrets import -a 10bonds --stage >/dev/null
            echo "Confirmation e-mails: key set (on once the domain is verified)."
          else
            echo "Confirmation e-mails: off (no RESEND_API_KEY secret)."
          fi
          # Paid plans switch on when the Stripe key exists; the app creates prices and the webhook itself.
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY" | flyctl secrets import -a 10bonds --stage >/dev/null
            echo "Paid plans: on."
          else
            echo "Paid plans: off (no STRIPE_SECRET_KEY secret)."
          fi
          # SEO: Search Console / GA4 read access and PageSpeed, each only when its secret exists.
          # The JSON key goes in base64 so its line breaks survive.
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            printf 'GOOGLE_SERVICE_ACCOUNT_JSON=%s\n' "$(printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" | base64 -w0)" | flyctl secrets import -a 10bonds --stage >/dev/null
            echo "Google Search Console / GA4: key set."
          fi
          if [ -n "$PAGESPEED_API_KEY" ]; then
            printf 'PAGESPEED_API_KEY=%s\n' "$PAGESPEED_API_KEY" | flyctl secrets import -a 10bonds --stage >/dev/null
          fi
          if [ -n "$BING_WEBMASTER_API_KEY" ]; then
            printf 'BING_WEBMASTER_API_KEY=%s\n' "$BING_WEBMASTER_API_KEY" | flyctl secrets import -a 10bonds --stage >/dev/null
            echo "Bing Webmaster Tools: key set."
          fi
          # Automatic posts of new guides (Admin -> SEO -> Sharing), each only when its secrets exist.
          if [ -n "$LINKEDIN_CLIENT_ID" ] && [ -n "$LINKEDIN_CLIENT_SECRET" ]; then
            printf 'LINKEDIN_CLIENT_ID=%s\nLINKEDIN_CLIENT_SECRET=%s\n' "$LINKEDIN_CLIENT_ID" "$LINKEDIN_CLIENT_SECRET" | flyctl secrets import -a 10bonds --stage >/dev/null
            echo "LinkedIn: app keys set (connect from Admin -> SEO -> Sharing)."
          fi
          if [ -n "$X_API_KEY" ] && [ -n "$X_API_SECRET" ] && [ -n "$X_ACCESS_TOKEN" ] && [ -n "$X_ACCESS_TOKEN_SECRET" ]; then
            printf 'X_API_KEY=%s\nX_API_SECRET=%s\nX_ACCESS_TOKEN=%s\nX_ACCESS_TOKEN_SECRET=%s\n' "$X_API_KEY" "$X_API_SECRET" "$X_ACCESS_TOKEN" "$X_ACCESS_TOKEN_SECRET" | flyctl secrets import -a 10bonds --stage >/dev/null
            echo "X: keys set."
          fi
          # Admin-only rating calculator (BR / IR button): the key of the chosen provider, each only when its secret exists.
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" | flyctl secrets import -a 10bonds --stage >/dev/null
          fi
          if [ -n "$OPENAI_API_KEY" ]; then
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" | flyctl secrets import -a 10bonds --stage >/dev/null
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" | flyctl secrets import -a 10bonds --stage >/dev/null
          fi
      - name: "Own domain: 10bonds.com and www (certificates, site address)"
        if: env.ok == '1'
        run: |
          flyctl ips list -a 10bonds | grep -q 'v4' || flyctl ips allocate-v4 --shared -a 10bonds
          flyctl ips list -a 10bonds | grep -q 'v6' || flyctl ips allocate-v6 -a 10bonds
          for h in 10bonds.com www.10bonds.com; do
            flyctl certs show "$h" -a 10bonds >/dev/null 2>&1 || flyctl certs add "$h" -a 10bonds
          done
          echo "---- IP addresses"; flyctl ips list -a 10bonds
          for h in 10bonds.com www.10bonds.com; do echo "---- $h"; flyctl certs show "$h" -a 10bonds || true; done
          # Switch the site's own address only when https://10bonds.com really answers.
          if curl -fsS -o /dev/null --max-time 15 https://10bonds.com/api/health; then
            printf 'SITE_URL=https://10bonds.com\nCANONICAL_HOST=10bonds.com\n' | flyctl secrets import -a 10bonds --stage >/dev/null
            echo "10bonds.com answers: site address is https://10bonds.com; fly.dev and www pages redirect there."
          else
            echo "10bonds.com does not answer yet: the site stays on 10bonds.fly.dev."
          fi
      - name: Deploy
        id: deploy
        if: env.ok == '1'
        run: flyctl deploy --remote-only -a 10bonds --ha=false
      # Read-only checks after the deploy. Each step fails on its own, so the run's step list says where
      # sign-up is broken without anyone opening the log. The answer holds a stage and a Postgres code only.
      - name: Wait for the site to answer
        if: env.ok == '1'
        run: |
          for i in $(seq 1 20); do
            curl -fsS --max-time 60 -o /dev/null https://10bonds.fly.dev/api/auth/me && exit 0
            sleep 6
          done
          exit 1
      - name: "Accounts database: login link and connection"
        if: env.ok == '1' && env.ACCOUNTS_DATABASE_URL != ''
        run: |
          body=$(curl -sS --max-time 60 -w ' HTTP %{http_code}' https://10bonds.fly.dev/api/health/accounts); echo "$body"
          echo "$body" | grep -qE '"stage":"(connect|url)"|HTTP 5' && exit 1 || exit 0
      - name: "Accounts database: tables and permissions"
        if: env.ok == '1' && env.ACCOUNTS_DATABASE_URL != ''
        run: |
          body=$(curl -sS --max-time 60 -w ' HTTP %{http_code}' https://10bonds.fly.dev/api/health/accounts); echo "$body"
          echo "$body" | grep -q '"stage":"ok"'
      - name: Robot check answers
        if: env.ok == '1'
        run: |
          code=$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' https://10bonds.fly.dev/api/auth/challenge)
          echo "challenge HTTP $code"
          [ "$code" = "200" ]
      - name: "Payments: Stripe prices, portal and webhook"
        if: env.ok == '1' && env.STRIPE_SECRET_KEY != ''
        run: |
          body=$(curl -sS --max-time 60 -w ' HTTP %{http_code}' https://10bonds.fly.dev/api/health/billing); echo "$body"
          echo "$body" | grep -q '"webhook":true'
      - name: "E-mail status (informational)"
        if: env.ok == '1'
        continue-on-error: true
        run: curl -sS --max-time 60 -w ' HTTP %{http_code}\n' https://10bonds.fly.dev/api/health/email
      - name: "Bond list: average yield matches the target and the maximum; no unrated bonds"
        if: env.ok == '1'
        run: |
          body=$(curl -sS --max-time 60 -w ' HTTP %{http_code}' https://10bonds.fly.dev/api/health/ranking); echo "$body"
          echo "$body" | grep -q '"ok":true'
      - name: "Bond data: fresh and complete (informational; the daily data watch alerts)"
        if: env.ok == '1'
        continue-on-error: true
        run: curl -sS --max-time 60 -w ' HTTP %{http_code}\n' https://10bonds.fly.dev/api/health/data
      # What the server said just before the failure (for finding the cause); the rollback below follows.
      - name: Server log of the failed release
        if: failure() && steps.deploy.outcome == 'success'
        continue-on-error: true
        run: flyctl logs -a 10bonds --no-tail 2>&1 | tail -80
      # A new release that fails any check above is replaced at once by the previous one; the run stays red.
      - name: Automatic rollback when a check failed
        if: failure() && steps.deploy.outcome == 'success'
        run: bash scripts/fly-rollback.sh
