name: Weekly top 10 e-mail
# Every Monday morning: asks the site to send the weekly top 10 e-mail to newsletter subscribers. The site sends
# nothing while the admin has it switched off (/admin/weekly-email). Uses ACCOUNTS_DATABASE_URL only to sign the request.
on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - name: Ask the site to send
        run: |
          if [ -z "$ACCOUNTS_DATABASE_URL" ]; then echo "No ACCOUNTS_DATABASE_URL: nothing to send."; exit 0; fi
          token=$(printf 'weekly-email' | openssl dgst -sha256 -hmac "$ACCOUNTS_DATABASE_URL" -hex | awk '{print $NF}')
          curl -fsS --retry 3 --max-time 60 -X POST -H "Authorization: Bearer $token" https://10bonds.com/api/newsletter/weekly
