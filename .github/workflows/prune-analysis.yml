name: Prune analysis
# run 1
# Read-only. Runs when this file is pushed on the thread branch. Counts EUR bonds kept by top-N-per-cell rules and checks whether the lists change. Temporary: delete after use.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-2k81fb]
    paths: [.github/workflows/prune-analysis.yml]
jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
      QUANT_OUT: quant-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: npx vite-node -c vitest.config.ts scripts/prune-analysis.ts
      - uses: actions/upload-artifact@v4
        with: { name: prune, path: quant-out, retention-days: 30 }
