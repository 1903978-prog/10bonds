name: Daily data watch
# Every morning: is the live bond list fresh (yields at most 4 days old) and complete (all columns, no duplicate ISINs)?
# A red run means the daily copy from lm-op-model stopped or changed shape; GitHub e-mails the repo owner.
# Read-only: it only calls the public health pages.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bond data is fresh and complete
        run: |
          body=$(curl -sS --max-time 60 -w '\nHTTP %{http_code}' https://10bonds.fly.dev/api/health/data); echo "$body"
          echo "$body" | grep -q '"ok":true'
      - name: Ranking self-check passes
        run: |
          body=$(curl -sS --max-time 60 -w '\nHTTP %{http_code}' https://10bonds.fly.dev/api/health/ranking); echo "$body"
          echo "$body" | grep -q '"ok":true'
