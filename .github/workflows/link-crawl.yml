name: Link check (all roles)
# Opens the live site in a real browser as a visitor, a free user and the read-only test admin, follows every internal link,
# sitemap page and admin page, and lists every 404/500, console error and empty page. Nightly at 02:10 UTC and on demand.
# A broken page turns the run red; the nightly live check (03:10 UTC) reports it in its one summary e-mail (10B-0008). Read-only: GET requests only, plus sign-in.
# The two test accounts are made by scripts/link-accounts.ts; their password is derived from a repository secret inside the run and never printed.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Site to check"
        default: "https://10bonds.com"
      roles:
        description: "Roles (comma separated): visitor, free, plus, premium, pro, admin"
        default: "visitor,free,plus,premium,pro,admin"
      paths:
        description: "Only these paths (comma separated), for a diagnosis run"
        default: ""
  schedule:
    - cron: "10 2 * * *"
concurrency:
  group: link-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BASE: ${{ inputs.base || 'https://10bonds.com' }}
      ROLES: ${{ inputs.roles || 'visitor,free,plus,premium,pro,admin' }}
      PATHS: ${{ inputs.paths }}
      OUT: link-check-out
      EXTRA_CHECKS: "1"
      CHROME_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - name: Test accounts
        run: |
          pw="$(printf 'linkcheck-v1:%s' "$ACCOUNTS_DATABASE_URL" | sha256sum | cut -c1-48)"
          echo "::add-mask::$pw"
          echo "LINKCHECK_PASSWORD=$pw" >> "$GITHUB_ENV"
          LINKCHECK_PASSWORD="$pw" npx vite-node -c vitest.config.ts scripts/link-accounts.ts
      - name: Crawl
        id: crawl
        run: node scripts/link-crawl.mjs
      - name: Summary
        if: always()
        run: cat "$OUT/link-check.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-check
          path: link-check-out/
