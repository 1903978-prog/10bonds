name: Outage tmp
on:
  push:
    branches: [claude/outage-tmp]
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl status -a 10bonds || true
      - run: flyctl logs -a 10bonds --no-tail 2>&1 | tail -70 | cut -c1-260 || true
      - run: timeout 80 flyctl ssh console -a 10bonds -C "sh -c 'cat /proc/pressure/cpu; free -m; uptime; top -bn1 | head -12; ss -tn state established | wc -l; ss -tn state established | awk \"{print \\\$4}\" | sort | uniq -c | sort -rn | head -5'" 2>&1 | tail -30 || true
      - run: for u in /api/health /; do curl -s -o /dev/null -w "$u %{http_code} %{time_total}s\n" -m 25 https://10bonds.com$u || true; done
