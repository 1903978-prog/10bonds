name: Outage tmp
on:
  push:
    branches: [claude/outage-tmp]
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl machine restart 8e3e5ea777e968 -a 10bonds --skip-health-checks || flyctl machine restart -a 10bonds --force || true
      - run: sleep 45; for i in 1 2 3 4 5 6; do for u in /api/health /; do curl -s -o /dev/null -w "$u %{http_code} %{time_total}s\n" -m 30 https://10bonds.com$u; done; sleep 10; done
      - run: flyctl status -a 10bonds || true
