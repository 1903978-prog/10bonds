name: Mem tmp
on:
  push:
    branches: [claude/mem-tmp]
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: node --expose-gc node_modules/.bin/vite-node -c vitest.config.ts scripts/mem-measure-tmp.ts
