name: UST first import (temporary)
on:
  push:
    branches: [claude/project-thread-pu3wb6]
    paths: [".github/workflows/ust-first-import.yml", "scripts/ust-selftest.ts"]
concurrency:
  group: ust-first-import
jobs:
  first:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - name: Bulk insert self-test (scratch rows, removed)
        run: npx vite-node -c vitest.config.ts scripts/ust-selftest.ts
      - name: Import 1
        run: set -o pipefail; npx vite-node -c vitest.config.ts scripts/ust-import.ts | tee run1.txt
      - name: Import 2 (must change nothing)
        run: set -o pipefail; npx vite-node -c vitest.config.ts scripts/ust-import.ts | tee run2.txt
      - name: Verify saved values against the raw source
        run: |
          curl -sS -L -m 90 -A "10bonds-benchmark/1.0" -o fed.csv https://www.federalreserve.gov/data/yield-curve-tables/feds200628.csv
          python3 - <<'PY'
          import csv, re
          lines = open('fed.csv', encoding='utf-8-sig').read().splitlines()
          h = next(i for i,l in enumerate(lines) if l.startswith('Date,'))
          head = lines[h].split(',')
          rows = [l.split(',') for l in lines[h+1:] if re.match(r'^\d{4}-\d{2}-\d{2},', l)]
          def full(r, pre):
            idx = [head.index('%s%02d' % (pre, y)) for y in range(1, 31)]
            vals = [r[i] for i in idx]
            return None if any(v in ('NA','') for v in vals) else [float(v) for v in vals]
          par = next((r[0], full(r,'SVENPY')) for r in reversed(rows) if full(r,'SVENPY'))
          zero = next((r[0], full(r,'SVENY')) for r in reversed(rows) if full(r,'SVENY'))
          print('source latest complete PAR', par[0], 'ZERO', zero[0], 'last row date', rows[-1][0], 'total rows', len(rows))
          out = open('run2.txt').read()
          m = re.search(r'fitted par yield (\d{4}-\d{2}-\d{2})', out)
          assert m and m.group(1) == par[0], ('saved PAR date differs', m and m.group(1), par[0])
          mz = re.search(r'zero-coupon (\d{4}-\d{2}-\d{2})', out)
          assert mz and mz.group(1) == zero[0], ('saved ZERO date differs', mz and mz.group(1), zero[0])
          tab = [l.split('|')[1:-1] for l in out.splitlines() if re.match(r'^\| \d+ \|', l)]
          assert len(tab) == 30, len(tab)
          for (y, p, *_ , z, t), sp, sz in zip(tab, par[1], zero[1]):
            assert abs(float(p) - sp) < 5e-5, ('par', y, p, sp)
            assert abs(float(z) - sz) < 5e-5, ('zero', y, z, sz)
          print('OK: 30 par and 30 zero values saved equal the source file to 4 decimals (zero date', zero[0], ')')
          PY
      - name: Summary
        if: always()
        run: |
          { echo '## Run 1'; cat run1.txt; echo; echo '## Run 2'; head -n 3 run2.txt; } >> "$GITHUB_STEP_SUMMARY" || true
# rerun after jsonb fix
