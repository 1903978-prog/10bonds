name: Bond data coverage
on: workflow_dispatch
jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          q() { psql "$DATABASE_URL" -X -A -t -F ' | ' -c "$1"; }
          echo "== per currency: total, with price_as_of, with clean_price, price 24h, coalesce 24h, newest price_as_of"
          q "select upper(trim(currency)), count(*), count(price_as_of), count(clean_price), count(*) filter (where price_as_of > now() - interval '24 hours'), count(*) filter (where coalesce(price_as_of, ytm_as_of) > now() - interval '24 hours'), max(price_as_of) from public_bonds where upper(trim(currency)) in ('EUR','USD') group by 1"
          echo "== per currency per price day (cur, day, dow, n)"
          q "select upper(trim(currency)), price_as_of::date, extract(dow from price_as_of::date), count(*) from public_bonds where upper(trim(currency)) in ('EUR','USD') group by 1,2,3 order by 1,2 desc limit 60"
