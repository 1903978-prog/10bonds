name: Bond data coverage
on: workflow_dispatch
jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          q() { psql "$DATABASE_URL" -X -A -t -F ' | ' -c "$1"; }
          echo "== columns"; q "select column_name, data_type from information_schema.columns where table_name='public_bonds' order by ordinal_position"
          for c in last_refresh_attempt_at refresh_status refresh_fail_reason price_source price_stale price_confirmed; do
            if [ "$(q "select count(*) from information_schema.columns where table_name='public_bonds' and column_name='$c'")" = 1 ]; then
              echo "== $c filled"; q "select upper(trim(currency)), count(*), count($c) from public_bonds where upper(trim(currency)) in ('EUR','USD') group by 1"
              echo "== $c values"; q "select $c::text, count(*) from public_bonds group by 1 order by 2 desc limit 15"
            else echo "== $c: NO COLUMN"; fi
          done
