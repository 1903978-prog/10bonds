name: Show BES snapshot
# On demand only: prints the BES figures stored in the published Efficient Database snapshots (read-only database reads, nothing is changed).
on:
  workflow_dispatch:
concurrency:
  group: show-bes-snapshot
  cancel-in-progress: true
jobs:
  show:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: npx vite-node -c vitest.config.ts scripts/show-bes-snapshot.ts | tee out.md
      - if: always()
        run: cat out.md >> "$GITHUB_STEP_SUMMARY" || true
