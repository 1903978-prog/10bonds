name: Phone speed check (Lighthouse)
# After each deploy and weekly: measures the language home pages on a simulated phone and stores the scores
# for the SEO dashboard (Mobile experience and performance). Needs ACCOUNTS_DATABASE_URL.
on:
  workflow_run:
    workflows: ["Deploy to Fly"]
    types: [completed]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
jobs:
  measure:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Lighthouse (mobile), 3 runs per page
        run: |
          sleep 60 # let the new version settle
          mkdir -p lh
          for m in it fr de; do
            for i in 1 2 3; do
              npx -y lighthouse@12.8.2 "https://10bonds.com/$m" --only-categories=performance,accessibility \
                --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="lh/$m-$i.json" --quiet || true
            done
          done
      - name: Store the scores for the SEO dashboard
        run: |
          if [ -z "$ACCOUNTS_DATABASE_URL" ]; then echo "No ACCOUNTS_DATABASE_URL: scores not stored."; exit 0; fi
          npm ci --ignore-scripts >/dev/null
          node scripts/lighthouse-seo.mjs lh
