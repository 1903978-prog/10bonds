# One-click rollback: Actions > "Roll back to the previous release" > Run workflow.
# Puts the image of the release before the current one back on Fly. Nothing is rebuilt and no data is touched.
# The deploy workflow runs the same script by itself when the checks after a deploy fail.
name: Roll back to the previous release
on:
  workflow_dispatch:
concurrency: deploy
jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Pinned: the same tool version every run, changed on purpose only.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.118
      - run: bash scripts/fly-rollback.sh
