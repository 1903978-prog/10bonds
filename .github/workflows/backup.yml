name: Nightly backup (accounts database, 30 days)
# Every night: copy the accounts database (schema "app": accounts, plans, codes, stats, guides) out of Neon,
# encrypt it, restore that encrypted copy into an empty database and check every table came back.
# The encrypted file is kept 30 days under this run's Artifacts. A red run means no good backup tonight.
# Key: secret BACKUP_KEY if set, otherwise the accounts database secret itself (whoever can open the backup could
# already open the database). Restore steps: docs/OPERATIONS.md > Backups.
on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
concurrency: backup
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      restore:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: restore-test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      ACCOUNTS_DATABASE_URL: ${{ secrets.ACCOUNTS_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_KEY: ${{ secrets.BACKUP_KEY || secrets.ACCOUNTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stop if the accounts database is not connected
        run: |
          if [ -z "$ACCOUNTS_DATABASE_URL" ]; then echo "No ACCOUNTS_DATABASE_URL secret: nothing to back up."; exit 1; fi
      - name: Back up and test the restore
        run: |
          export SOURCE_URL="$(node scripts/accounts-url.mjs)"
          echo "::add-mask::$SOURCE_URL"
          export RESTORE_URL="postgres://postgres:restore-test@localhost:5432/postgres"
          export PG_RUN="docker run --rm -i --network host postgres:18"
          export OUT="accounts-$(date -u +%Y-%m-%d).dump.enc"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          bash scripts/backup-accounts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: accounts-backup-${{ github.run_id }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
          retention-days: 30
          if-no-files-found: error
      # Only reached when the backup, the restore test and the upload all passed. secval's database check reads these two
      # times (GET /api/secval/db-health, lib/secvalDbHealth.ts); a missed night shows there as an old backup.
      - name: Record the good backup and restore test
        run: |
          URL="$(node scripts/accounts-url.mjs)"
          echo "::add-mask::$URL"
          docker run --rm -i --network host postgres:18 psql "$URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          insert into app.settings (key, value) values
            ('backup_last_ok_at', to_char(now() at time zone 'utc', 'YYYY-MM-DD"T"HH24:MI:SS"Z"')),
            ('backup_restore_test_ok_at', to_char(now() at time zone 'utc', 'YYYY-MM-DD"T"HH24:MI:SS"Z"'))
          on conflict (key) do update set value = excluded.value, updated_at = now();
          SQL
      # A red night sends ONE e-mail (the app also refuses a second backup e-mail on the same UTC day).
      - name: One e-mail if the backup or restore test failed
        if: failure()
        run: |
          if [ -z "$ACCOUNTS_DATABASE_URL" ]; then echo "No ACCOUNTS_DATABASE_URL: cannot e-mail."; exit 0; fi
          token=$(printf 'live-check-alert' | openssl dgst -sha256 -hmac "$ACCOUNTS_DATABASE_URL" -hex | awk '{print $NF}')
          body=$(jq -n --arg u "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{kind:"backup",summary:"No good backup tonight. Open the run and read the step Back up and test the restore.",runUrl:$u}')
          curl -sS --retry 2 --max-time 30 -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d "$body" https://10bonds.com/api/admin/live-check-alert || true
