name: AEOS validate
# Manual only (no push / PR trigger) so it never spends Actions minutes on its own.
on:
  workflow_dispatch:
concurrency:
  group: aeos-validate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: python3 scripts/aeos/aeos.py validate
      - run: python3 scripts/aeos/test_aeos.py
