# Fly.io config for the public 10BONDS website. Separate app, separate machine,
# no connection to lm-op-model. Secrets (set with `fly secrets set`): DATABASE_URL (read-only Neon login).
app = "10bonds"
primary_region = "cdg"

[build]

# Zero-downtime releases (Livio 29/10/2026): the new machine starts and passes /api/health before the old one stops. Costs only the few minutes of the overlap, not a second machine all month.
[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # Kept running (the owner, 24/10/2026): a stopped machine made the first visitor wait up to 20 seconds.
  min_machines_running = 1

  # Hide the host's version stamp (Server) and proxy name (Via) from responses (secval, 26/10/2026).
  # Fly's default allows only 25 requests at once per machine and answers 503 above it (the 26-45th page of a busy moment waited ~30 s). The
  # server handles far more at a time; heavy work never runs in the web process.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 250

  [http_service.http_options.response.headers]
    server = false
    via = false

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "40s"
    method = "GET"
    path = "/api/health"

# 4 shared CPUs (was 1): the single shared CPU was throttled to a small share once its burst credit ran out, so pages took 15+ s. About +2 USD/month.
[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 4
