# Fly.io config for the public 10BONDS website. Separate app, separate machine,
# no connection to lm-op-model. Secrets (set with `fly secrets set`): DATABASE_URL (read-only Neon login).
app = "10bonds"
primary_region = "cdg"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Kept running (the owner, 24/10/2026): a stopped machine made the first visitor wait up to 20 seconds.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
